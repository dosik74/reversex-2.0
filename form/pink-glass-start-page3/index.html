<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>New Tab</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Inter', sans-serif;
        overflow: hidden; /* Prevent scrolling on the main page */
        background-color: #000;
      }
      /* Custom Scrollbar */
      .custom-scrollbar::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      .custom-scrollbar::-webkit-scrollbar-track {
        background: rgba(var(--theme-rgb), 0.05);
      }
      .custom-scrollbar::-webkit-scrollbar-thumb {
        background: rgba(var(--theme-rgb), 0.3);
        border-radius: 10px;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb:hover {
        background: rgba(var(--theme-rgb), 0.6);
      }
      
      /* GLASSMORPHISM - Uses dynamic CSS Variable */
      .glass-panel {
        background: rgba(var(--theme-rgb), 0.1); 
        backdrop-filter: blur(24px);
        -webkit-backdrop-filter: blur(24px);
        border: 1px solid rgba(var(--theme-rgb), 0.25);
        box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
      }

      /* Hover effect for glass items */
      .glass-hover:hover {
        background: rgba(var(--theme-rgb), 0.2);
        border-color: rgba(var(--theme-rgb), 0.4);
      }
      
      .glass-input {
        background: rgba(0, 0, 0, 0.3);
        backdrop-filter: blur(12px);
        border: 1px solid rgba(var(--theme-rgb), 0.3);
        color: white;
      }
      
      .glass-input::placeholder {
        color: rgba(var(--theme-rgb), 0.6);
      }
    </style>
