<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ReverseX - Приложение</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #0f0f0f;
            overflow: hidden;
        }
        
        .webview-container {
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        .header {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            padding: 12px 16px;
            border-bottom: 1px solid #444;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #fff;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
        }
        
        .header-title {
            font-size: 14px;
            font-weight: 600;
        }
        
        .header-buttons {
            display: flex;
            gap: 8px;
        }
        
        button {
            background: #2a2a4e;
            border: 1px solid #444;
            color: #fff;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.2s;
        }
        
        button:hover {
            background: #3a3a5e;
            border-color: #666;
        }
        
        button:active {
            transform: scale(0.98);
        }
        
        iframe {
            flex: 1;
            border: none;
            width: 100%;
            height: 100%;
        }
        
        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: #888;
        }
        
        .loading-spinner {
            border: 3px solid #2a2a4e;
            border-top: 3px solid #666;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 16px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="webview-container">
        <div class="header">
            <span class="header-title">ReverseX Приложение</span>
            <div class="header-buttons">
                <button onclick="goBack()">← Назад</button>
                <button onclick="goForward()">Вперёд →</button>
                <button onclick="reloadPage()">Обновить</button>
                <button onclick="openExternal()">Открыть в браузере</button>
            </div>
        </div>
        <div style="position: relative; flex: 1;">
            <div class="loading" id="loading">
                <div class="loading-spinner"></div>
                <p>Загрузка ReverseX...</p>
            </div>
            <iframe 
                id="webview" 
                src="https://reversex.vercel.app/" 
                onload="document.getElementById('loading').style.display = 'none';"
                allow="geolocation; microphone; camera"
            ></iframe>
        </div>
    </div>

    <script>
        function goBack() {
            try {
                document.getElementById('webview').contentWindow.history.back();
            } catch (e) {
                console.log('Cannot go back');
            }
        }

        function goForward() {
            try {
                document.getElementById('webview').contentWindow.history.forward();
            } catch (e) {
                console.log('Cannot go forward');
            }
        }

        function reloadPage() {
            document.getElementById('webview').src = 'https://reversex.vercel.app/';
        }

        function openExternal() {
            window.open('https://reversex.vercel.app/', '_blank');
        }

        // Горячие клавиши
        document.addEventListener('keydown', (e) => {
            if (e.altKey && e.key === 'ArrowLeft') goBack();
            if (e.altKey && e.key === 'ArrowRight') goForward();
            if (e.ctrlKey && e.key === 'r') {
                e.preventDefault();
                reloadPage();
            }
        });
    </script>
</body>
</html>
